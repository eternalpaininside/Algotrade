services:
  algotrade-postgres:
    image: postgres:18.6-bookworm
    container_name: algotrade-env-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  algotrade-postgres-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: algotrade-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:algotrade-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      - algotrade-postgres


  application:
    build: ./backend/cmd/
    container_name: application-container
